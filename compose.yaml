services:
  now-playing:
    build:
      context: ./receiver
    image: apple-music-widget-bridge-receiver:0.1.0
    restart: unless-stopped
    environment:
      NOW_PLAYING_WRITE_SECRET: ${NOW_PLAYING_WRITE_SECRET:?Set NOW_PLAYING_WRITE_SECRET in .env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - now-playing-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/now-playing/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  now-playing-data:
