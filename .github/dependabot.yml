version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /examples/react
    schedule:
      interval: monthly
    groups:
      example-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /receiver
    schedule:
      interval: monthly
    ignore:
      # Major Node.js upgrades are chosen by hand so the receiver stays on an
      # LTS line; odd-numbered releases never become LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
