name: Bug report
description: Report a reproducible problem without including secrets or private listening data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not paste write secrets, Keychain output, private URLs, or sensitive listening history.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS publisher
        - self-hosted receiver
        - universal widget
        - documentation or deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, browser, Node.js, Docker, and reverse proxy versions that are relevant.
