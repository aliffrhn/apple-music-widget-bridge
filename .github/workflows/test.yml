name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node receiver & widgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check package versions
        run: node scripts/check-versions.mjs
      - name: Test receiver
        working-directory: receiver
        run: npm test
      - name: Test universal widget
        working-directory: widget
        run: npm test
      - name: Test React widget model
        working-directory: widget/react
        run: npm test
      - name: Install React example
        working-directory: examples/react
        run: npm ci
      - name: Build React example
        working-directory: examples/react
        run: npm run build

  supabase:
    name: Supabase adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint and type-check the Edge Function
        run: |
          deno lint examples/supabase
          deno check examples/supabase/supabase/functions/bridge-now-playing/index.ts
      - name: Test the Edge Function handler
        run: deno test examples/supabase
      - name: Apply the migration to Postgres
        run: |
          # Stand in for the roles and Storage table that Supabase provides.
          psql -v ON_ERROR_STOP=1 -c "
            create role anon nologin;
            create role authenticated nologin;
            create role service_role nologin bypassrls;
            grant usage on schema public to anon, authenticated, service_role;
            create schema storage;
            create table storage.buckets (
              id text primary key, name text not null, public boolean,
              file_size_limit bigint, allowed_mime_types text[]
            );"
          # Twice, to confirm the migration can be re-run.
          for run in 1 2; do
            psql -v ON_ERROR_STOP=1 -q -f examples/supabase/supabase/migrations/*_bridge_now_playing.sql
          done
          test "$(psql -tAc "select status from public.bridge_now_playing where id = 'current'")" = unavailable
          test "$(psql -tAc "select public from storage.buckets where id = 'bridge-now-playing-artwork'")" = t
          if psql -c "set role anon; select * from public.bridge_now_playing" >/dev/null 2>&1; then
            echo "anon can read the state table" >&2
            exit 1
          fi

  macos:
    name: macOS publisher
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run release checks
        run: ./tests/run.sh

  docker:
    name: Receiver container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the Compose stack
        run: |
          printf 'NOW_PLAYING_WRITE_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait
      - name: Check health through the published port
        run: curl --fail --silent http://127.0.0.1:8787/api/now-playing/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
