# Put this zone in the http block (for example, /etc/nginx/conf.d/now-playing-zone.conf).
# It limits each client IP to 30 requests per minute on the receiver routes.
# limit_req_zone $binary_remote_addr zone=now_playing:10m rate=30r/m;

# Add the locations below inside the HTTPS server block for your website.
# The receiver remains private on 127.0.0.1:8787.
location = /api/now-playing {
    limit_req zone=now_playing burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787;
}

location ^~ /api/now-playing/ {
    limit_req zone=now_playing burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787;
}
